# Thông tin kết nối PostgreSQL (Khớp với docker-compose lúc nãy)
spring.datasource.url=jdbc:postgresql://localhost:5432/medicare_db
spring.datasource.username=postgres
spring.datasource.password=medicare_password
spring.datasource.driver-class-name=org.postgresql.Driver

# Cấu hình Hibernate (Tự động tạo bảng & In log SQL)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Chạy server ở cổng 8080
server.port=8080

# Cấu hình giới hạn dung lượng tải file (Upload size)
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB